
AWSTemplateFormatVersion: '2010-09-09'

Description: Three-tier architecture - Daniel Onyeji L00205450
  
Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the web and application servers
    AllowedValues:
      - t3.micro
      - t3.small

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI

  DatabasePassword:
      Type: String
      NoEcho: true
      MinLength: 8
      Description: Password for the MySQL database

Resources:

  # Create a private network for our AWS resources
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Onyeji-ThreeTier-VPC

  # Public subnet for the web tier
  WebSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Onyeji-Web-Subnet

  # Private subnet for the application tier
  AppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-east-1a
      Tags:
        - Key: Name
          Value: Onyeji-App-Subnet

  # Private subnet for the database tier
  DatabaseSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Onyeji-Database-Subnet

  # Internet Gateway allows internet connectivity
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Onyeji-Internet-Gateway

  # Attach the Internet Gateway to our VPC
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

  # Create a route table for the public web subnet
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC

  # Send internet traffic through the gateway
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Associate the web subnet with the public route table
  WebSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnet
      RouteTableId: !Ref PublicRouteTable

  # Security group for the public web server
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access to web tier
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # Security group for the private application server
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow web tier to reach application tier
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref WebSecurityGroup

  # Security group for the private database
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow application tier to reach database
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup

  # Create the web server using Amazon Linux 2023
  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref WebSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      Tags:
        - Key: Name
          Value: Onyeji-Web-Server
      
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y nginx

          # Configure Nginx to forward application requests
          cat > /etc/nginx/conf.d/app.conf <<'NGINX'
          server {
              listen 80;

              location / {
                  root /usr/share/nginx/html;
                  index index.html;
              }

              location /api/ {
                  proxy_pass http://${AppServer.PrivateIp}:8080/;
              }
          }
          NGINX

          # Create the homepage
          echo "<h1>Daniel Onyeji - L00205450</h1>" > /usr/share/nginx/html/index.html

          systemctl enable nginx
          systemctl start nginx


  # Create the private application server
  AppServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref AppSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: Onyeji-App-Server
      
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          mkdir -p /opt/myapp
          echo '${MyDatabase.Endpoint.Address}' > /opt/myapp/db-host.txt
          cat > /opt/myapp/server.py <<'PYTHON'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import socket

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):

                  if self.path == "/db-check":
                      try:
                          with open("/opt/myapp/db-host.txt") as f:
                              db_host = f.read().strip()
                          with socket.create_connection((db_host, 3306), timeout=5):
                              message = b"SUCCESS: Application Server can reach MySQL on port 3306"
                      except Exception:
                          message = b"FAILED: Application Server cannot reach MySQL"
                  else:
                      message = b"Application Tier - Daniel Onyeji L00205450"

                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.end_headers()
                  self.wfile.write(message)

          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PYTHON
          nohup python3 /opt/myapp/server.py > /var/log/myapp.log 2>&1 &



  # Second database subnet in another Availability Zone
  DatabaseSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Onyeji-Database-Subnet-2


  # Group the two private subnets for Amazon RDS
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the database tier
      SubnetIds:
        - !Ref DatabaseSubnet
        - !Ref DatabaseSubnet2
      Tags:
        - Key: Name
          Value: Onyeji-Database-Subnet-Group


  # Create a private MySQL database
  MyDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      DBName: AppDatabase
      MasterUsername: adminuser
      MasterUserPassword: !Ref DatabasePassword
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: true
      DeletionProtection: false
